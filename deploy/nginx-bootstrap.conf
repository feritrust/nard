# ─────────────────────────────────────────────────────────────
#  پیکربندی موقت — فقط HTTP، بدون SSL
#
#  مرغ و تخم‌مرغ: nginx بدون گواهی بالا نمی‌آید، و certbot بدون
#  nginxِ بالا گواهی نمی‌گیرد. پس اول این را می‌گذاریم، گواهی را
#  می‌گیریم، بعد به nginx-nard.conf سوییچ می‌کنیم.
#
#  همه‌ی این کارها را deploy/enable-ssl.sh خودکار انجام می‌دهد.
# ─────────────────────────────────────────────────────────────

limit_req_zone $binary_remote_addr zone=nard_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=nard_api:10m rate=120r/m;

upstream nard_game { server 127.0.0.1:8080; keepalive 32; }
upstream nard_web  { server 127.0.0.1:3000; keepalive 32; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name farhadtest.ir www.farhadtest.ir _;

    # مسیر تأیید مالکیت دامنه برای certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /auth/ {
        limit_req zone=nard_auth burst=5 nodelay;
        proxy_pass http://nard_game;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        limit_req zone=nard_api burst=40 nodelay;
        proxy_pass http://nard_game;
        include /etc/nginx/proxy_params;
    }

    location /adminapi/ {
        proxy_pass http://nard_game;
        include /etc/nginx/proxy_params;
    }

    location = /health {
        access_log off;
        proxy_pass http://nard_game;
        include /etc/nginx/proxy_params;
    }

    location /ws {
        proxy_pass http://nard_game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /play {
        rewrite ^/play/?$ / break;
        proxy_pass http://nard_game;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://nard_web;
        include /etc/nginx/proxy_params;
    }
}
