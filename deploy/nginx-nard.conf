# ─────────────────────────────────────────────────────────────
#  پیکربندی nginx
#
#  nard.example.com        →  سایت و پنل مدیریت (Next.js، پورت ۳۰۰۰)
#  nard.example.com/play   →  خود بازی
#  nard.example.com/ws     →  وب‌سوکت بازی
#  nard.example.com/api    →  API سرور بازی
#
#  نصب:
#    sudo cp deploy/nginx-nard.conf /etc/nginx/sites-available/nard
#    sudo ln -s /etc/nginx/sites-available/nard /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx -d nard.example.com
# ─────────────────────────────────────────────────────────────

# محدودیت نرخ برای مسیرهای حساس (جلوگیری از حمله‌ی پیامکی و brute-force)
limit_req_zone $binary_remote_addr zone=nard_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=nard_api:10m rate=120r/m;

upstream nard_game { server 127.0.0.1:8080; keepalive 32; }
upstream nard_web  { server 127.0.0.1:3000; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name nard.example.com;
    # certbot این را به ریدایرکت https تبدیل می‌کند
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nard.example.com;

    # certbot این خط‌ها را خودش پر می‌کند
    # ssl_certificate     /etc/letsencrypt/live/nard.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/nard.example.com/privkey.pem;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── ورود و کد تأیید: سخت‌گیرانه ──────────────────────────
    location /auth/ {
        limit_req zone=nard_auth burst=5 nodelay;
        proxy_pass http://nard_game;
        include /etc/nginx/proxy_params;
    }

    # ── API بازیکن‌ها ─────────────────────────────────────────
    location /api/ {
        limit_req zone=nard_api burst=40 nodelay;
        proxy_pass http://nard_game;
        include /etc/nginx/proxy_params;
    }

    # ── API پنل مدیریت ───────────────────────────────────────
    location /admin/ {
        # مسیرهایی که با /admin/ شروع می‌شوند و API هستند
        # (صفحه‌های خود پنل از Next.js می‌آیند — پایین‌تر)
        proxy_pass http://nard_web;
        include /etc/nginx/proxy_params;
    }

    # ── وب‌سوکت بازی ─────────────────────────────────────────
    location /ws {
        proxy_pass http://nard_game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;   # بازی ممکن است طولانی باشد
        proxy_send_timeout 600s;
    }

    # ── خود بازی ─────────────────────────────────────────────
    location /play {
        rewrite ^/play/?$ / break;
        proxy_pass http://nard_game;
        include /etc/nginx/proxy_params;
    }

    # ── سایت و پنل (Next.js) ─────────────────────────────────
    location / {
        proxy_pass http://nard_web;
        include /etc/nginx/proxy_params;
    }
}
