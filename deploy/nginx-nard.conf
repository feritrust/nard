# ─────────────────────────────────────────────────────────────
#  پیکربندی nginx
#
#  farhadtest.ir        →  سایت و پنل مدیریت (Next.js، پورت ۳۰۰۰)
#  farhadtest.ir/play   →  خود بازی
#  farhadtest.ir/ws     →  وب‌سوکت بازی
#  farhadtest.ir/api    →  API سرور بازی
#
#  ⚠️ این فایل به /etc/nginx/nard-ssl.conf نیاز دارد و بدون گواهی SSL
#     بالا نمی‌آید. مستقیم نصبش نکنید — این را اجرا کنید:
#         sudo bash deploy/enable-ssl.sh
#     که خودش پیکربندی موقت HTTP را می‌گذارد، گواهی می‌گیرد و بعد
#     این فایل را فعال می‌کند.
#
#  نصب دستی (اگر گواهی از قبل دارید):
#    sudo cp deploy/cloudflare-realip.conf /etc/nginx/conf.d/
#    sudo cp deploy/proxy_params /etc/nginx/proxy_params
#    sudo cp deploy/nginx-nard.conf /etc/nginx/sites-available/nard
#    sudo ln -s /etc/nginx/sites-available/nard /etc/nginx/sites-enabled/
#    sudo rm -f /etc/nginx/sites-enabled/default
#    sudo nginx -t && sudo systemctl reload nginx
#
#  برای دامنه‌ی دیگر:  sudo bash deploy/set-domain.sh example.com
# ─────────────────────────────────────────────────────────────

# محدودیت نرخ برای مسیرهای حساس (جلوگیری از حمله‌ی پیامکی و brute-force)
# ⚠️ $binary_remote_addr فقط وقتی درست است که cloudflare-realip.conf نصب
#    شده باشد؛ وگرنه همه‌ی کاربرها یک IP (کلادفلر) دیده می‌شوند.
limit_req_zone $binary_remote_addr zone=nard_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=nard_api:10m rate=120r/m;

upstream nard_game { server 127.0.0.1:8080; keepalive 32; }
upstream nard_web  { server 127.0.0.1:3000; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name farhadtest.ir www.farhadtest.ir;

    # certbot برای تأیید مالکیت دامنه از این مسیر استفاده می‌کند —
    # باید قبل از ریدایرکت باشد.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://farhadtest.ir$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name farhadtest.ir www.farhadtest.ir;

    # مسیر گواهی در یک فایل جدا نگه داشته می‌شود تا این پیکربندی با هر
    # نوع گواهی (Let's Encrypt یا Origin Certificate کلادفلر) کار کند.
    # این فایل را deploy/enable-ssl.sh می‌سازد.
    include /etc/nginx/nard-ssl.conf;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # www → بدون www (برای SEO؛ فقط یک نشانی کانونیک داشته باشیم)
    if ($host = www.farhadtest.ir) { return 301 https://farhadtest.ir$request_uri; }

    # ── ورود و کد تأیید: سخت‌گیرانه ──────────────────────────
    location /auth/ {
        limit_req zone=nard_auth burst=5 nodelay;
        proxy_pass http://nard_game;
        include /etc/nginx/proxy_params;
    }

    # ── API بازیکن‌ها ─────────────────────────────────────────
    location /api/ {
        limit_req zone=nard_api burst=40 nodelay;
        proxy_pass http://nard_game;
        include /etc/nginx/proxy_params;
    }

    # ── API پنل مدیریت ───────────────────────────────────────
    # صفحه‌های پنل روی /admin/... از Next.js می‌آیند (بلوک آخر)،
    # ولی داده‌هایش از سرور بازی. برای همین API پیشوند جدا دارد.
    location /adminapi/ {
        limit_req zone=nard_auth burst=20 nodelay;
        proxy_pass http://nard_game;
        include /etc/nginx/proxy_params;
    }

    # ── بررسی سلامت سرور بازی ────────────────────────────────
    location = /health {
        access_log off;
        proxy_pass http://nard_game;
        include /etc/nginx/proxy_params;
    }

    # ── وب‌سوکت بازی ─────────────────────────────────────────
    location /ws {
        proxy_pass http://nard_game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # $remote_addr بعد از real_ip همان IP واقعی بازیکن است
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 600s;   # بازی ممکن است طولانی باشد
        proxy_send_timeout 600s;
    }

    # ── خود بازی ─────────────────────────────────────────────
    # index.html مسیرهای نسبی دارد (css/style.css و js/*.js) تا در اپ
    # اندروید با file:// هم کار کند. پس نشانی باید **با اسلش پایانی**
    # باشد، وگرنه مرورگر css را از /css/style.css می‌خواهد که به Next.js
    # می‌رود و ۴۰۴ می‌گیرد — صفحه بدون استایل و بدون جاوااسکریپت بالا می‌آید.
    location = /play { return 301 /play/; }

    location /play/ {
        # اسلش پایانی در proxy_pass یعنی «/play/ را بردار» —
        # /play/css/style.css روی سرور بازی می‌شود /css/style.css
        proxy_pass http://nard_game/;
        include /etc/nginx/proxy_params;
    }

    # ── سایت و پنل (Next.js) ─────────────────────────────────
    location / {
        proxy_pass http://nard_web;
        include /etc/nginx/proxy_params;
    }
}
